<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#483D8B" />
      <stop offset="50%" stop-color="#6749B9" />
      <stop offset="100%" stop-color="#866EC7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFA000" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- Inner border ring -->
  <rect x="24" y="24" width="464" height="464" rx="80" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="6" />

  <!-- Crown Icon & POS Symbol -->
  <g filter="url(#shadow)" transform="translate(0, 10)">
    <!-- Crown for Regal -->
    <path d="M140 210 L180 290 L256 180 L332 290 L372 210 L390 320 L122 320 Z" fill="url(#goldGrad)" stroke="#FF8F00" stroke-width="4" stroke-linejoin="round" />
    <circle cx="140" cy="205" r="14" fill="#FFF8E1" />
    <circle cx="256" cy="172" r="18" fill="#FFF8E1" />
    <circle cx="372" cy="205" r="14" fill="#FFF8E1" />

    <!-- Terminal Register Base -->
    <rect x="140" y="340" width="232" height="52" rx="10" fill="#FFFFFF" />
    <rect x="160" y="356" width="120" height="20" rx="4" fill="#866EC7" />
    <circle cx="310" cy="366" r="8" fill="#4CAF50" />
    <circle cx="340" cy="366" r="8" fill="#2196F3" />
  </g>

  <!-- Title Text -->
  <text x="256" y="445" font-family="'Poppins', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    REGAL POS
  </text>
</svg>
